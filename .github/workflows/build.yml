    aliceDb.collection("challenges").doc("chal_1").set({
      creatorId: ALICE_UID,
      creatorName: "Alice",
      mode: "duel",
      title: "Duelo fotográfico rápido",
      missionId: "mission_1",
      xpStake: 150,
      status: "open",
      participantIds: [ALICE_UID],
      creatorProgress: 0,
